<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Small Business and Livelihood Assistant</title>
    <style>
        body{
            margin: 0;
            background: #f3f5f4;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: #1c2421;
        }
        .card{
            display: flex;
            flex-direction: column;
            max-width: 760px;
            width: 100%;
            height: calc(100vh - 48px);
            margin: 24px auto;
            box-sizing: border-box;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        header{
            background: #1f6f50;
            color: white;
            padding: 16px 24px;
        }
        header h1{
            margin: 0;
            font-size: 20px;
        }
        header p{
            margin: 2px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }
        #chatbox{
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 24px;
            overflow-y: auto;
        }
        .user{
            align-self: flex-end;
            background: #1f6f50;
            color: white;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
        }
        .bot{
            align-self: flex-start;
            background: #f1f4f3;
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            max-width: 80%;
        }
        .bot::before{
            content: "Assistant";
            display: block;
            margin-bottom: 2px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #1f6f50;
        }
        .text{
            white-space: pre-line;
        }
        .text ul{
            margin: 4px 0;
            padding-left: 20px;
        }
        .sources{
            font-size: 12px;
            color: #5f6b66;
            margin-top: 8px;
        }
        .sources summary{
            cursor: pointer;
            color: #1f6f50;
            font-weight: 600;
        }
        .sources ul{
            margin: 4px 0 0;
            padding-left: 18px;
        }
        .sources a{
            color: #1f6f50;
        }
        .example{
            display: inline-block;
            margin: 8px 6px 0 0;
            padding: 6px 12px;
            border: 1px solid #1f6f50;
            border-radius: 999px;
            background: white;
            color: #1f6f50;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
        }
        .example:hover{
            background: #e8f2ee;
        }
        form{
            padding: 12px 24px;
            border-top: 1px solid #e3e8e6;
        }
        .align{
            display: flex;
            flex-direction: row;
            gap: 8px;
        }
        textarea{
            flex: 1;
            height: 50px;
            padding: 10px 12px;
            border: 1px solid #cfd8d4;
            border-radius: 10px;
            font: inherit;
            resize: none;
        }
        textarea:focus{
            outline: none;
            border-color: #1f6f50;
            box-shadow: 0 0 0 3px rgba(31, 111, 80, 0.15);
        }
        button[name="submit"]{
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: #1f6f50;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button[name="submit"]:hover{
            background: #185a41;
        }
        button[name="submit"]:disabled{
            background: #b8c4bf;
            cursor: not-allowed;
        }
        #message{
            color: #c0392b;
            padding: 0 24px;
        }
        #message:empty{
            display: none;
        }
        footer{
            padding: 4px 24px 14px;
            font-size: 12px;
            color: #6b7570;
        }
        .waiting::after{
            content: "";
            animation: dots 1.5s steps(4) infinite;
        }
        @keyframes dots{
            0%{ content: ""; }
            25%{ content: "."; }
            50%{ content: ".."; }
            75%{ content: "..."; }
        }
        @media (max-width: 600px){
            .card{
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
            #chatbox, form{
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <header>
            <h1>Small Business and Livelihood Assistant</h1>
            <p>Baguio City &amp; Benguet</p>
        </header>
        <div id="chatbox">{% include "messages.html" %}</div>
        <form id="askForm">
            <div class="align">
                <textarea name="question" maxlength="500" placeholder="Type your question..."></textarea>
                <button name="submit">Send</button>
            </div>
        </form>
        <div id="message"></div>
        <footer>Answers come from official sources. Confirm with the office before you apply.</footer>
    </div>

    <script>
    function ask(){
        document.getElementById('askForm').addEventListener('submit', function(e){
            e.preventDefault();

            const form = this;
            const formData = new FormData(form);
            const question = formData.get('question').trim();
            const chatbox = document.getElementById('chatbox');

            if (question == '') {
                document.getElementById('message').innerHTML = 'Please type a question.';
                return;
            }

            document.getElementById('message').innerHTML = '';
            form.reset();
            chatbox.innerHTML += `
                <div class="user"><div class="text">${escapeHtml(question)}</div></div>
                <div class="bot waiting">Searching the knowledge base and writing an answer. This can take up to 30 seconds</div>
            `;
            chatbox.scrollTop = chatbox.scrollHeight;
            sendButton.disabled = true;

            fetch('/ask', { method: 'post', body: formData })
                .then(response => {
                    // JSON means an error; plain text is the answer as gemma writes it
                    if (response.headers.get('Content-Type').startsWith('application/json')) {
                        return response.json().then(data => {
                            document.getElementById('message').innerHTML = escapeHtml(data.message);
                            sendButton.disabled = false;
                            questionBox.focus();
                            loadMessages();
                        });
                    }
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    const bubble = chatbox.lastElementChild;
                    let answer = '';
                    function readPiece(){
                        return reader.read().then(result => {
                            if (result.done) {
                                sendButton.disabled = false;
                                questionBox.focus();
                                loadMessages();
                                return;
                            }
                            answer += decoder.decode(result.value, { stream: true });
                            bubble.classList.remove('waiting');
                            bubble.innerHTML = `<div class="text">${escapeHtml(answer)}</div>`;
                            chatbox.scrollTop = chatbox.scrollHeight;
                            return readPiece();
                        });
                    }
                    return readPiece();
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('message').innerHTML = 'Could not reach the server. Is app.py running?';
                    sendButton.disabled = false;
                    questionBox.focus();
                    loadMessages();
                });
        });

        // Enter sends the question; Shift+Enter adds a new line
        questionBox.addEventListener('keydown', function(e){
            if (e.key == 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendButton.disabled) askForm.requestSubmit();
            }
        });

        // Example questions in the welcome message
        document.getElementById('chatbox').addEventListener('click', function(e){
            if (e.target.classList.contains('example') && !sendButton.disabled) {
                questionBox.value = e.target.textContent;
                askForm.requestSubmit();
            }
        });
    }

    const askForm = document.getElementById('askForm');
    const questionBox = askForm.querySelector('textarea');
    const sendButton = askForm.querySelector('button');

    function loadMessages(){
        fetch('/messages')
            .then(response => response.text())
            .then(html => {
                const chatbox = document.getElementById('chatbox');
                chatbox.innerHTML = html;
                chatbox.scrollTop = chatbox.scrollHeight;
            })
            .catch(error => console.error(error));
    }

    function escapeHtml(text){
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.getElementById('chatbox').scrollTop = document.getElementById('chatbox').scrollHeight;
    ask();
    </script>
</body>
</html>

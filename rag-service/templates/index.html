<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Small Business and Livelihood Assistant</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        .card{
            border: solid black 1px;
            padding: 30px;
            border-radius: 25px;
            width: 700px;
        }
        #chatbox{
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .user{
            align-self: flex-end;
            background: #1f6f50;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
        }
        .bot{
            align-self: flex-start;
            background: #f0f0f0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
        }
        .sources{
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }
        .text{
            white-space: pre-line;
        }
        .align{
            display: flex;
            flex-direction: row;
            gap: 8px;
        }
        textarea{
            flex: 1;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="card">
        <center><h2>Small Business and Livelihood Assistant</h2></center>
        <div id="chatbox">{% include "messages.html" %}</div>
        <form id="askForm">
            <div class="align">
                <textarea name="question" placeholder="Type your question..."></textarea>
                <button name="submit">Send</button>
            </div>
        </form>
        <div id="message"></div>
    </div>

    <script>
    function ask(){
        document.getElementById('askForm').addEventListener('submit', function(e){
            e.preventDefault();

            const form = this;
            const formData = new FormData(form);
            const question = formData.get('question').trim();
            const chatbox = document.getElementById('chatbox');

            if (question == '') {
                document.getElementById('message').innerHTML = 'Please type a question.';
                return;
            }

            document.getElementById('message').innerHTML = '';
            form.reset();
            chatbox.innerHTML += `
                <div class="user"><div class="text">${escapeHtml(question)}</div></div>
                <div class="bot">Thinking...</div>
            `;
            chatbox.scrollTop = chatbox.scrollHeight;

            fetch('/ask', { method: 'post', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.status != 'success') {
                        document.getElementById('message').innerHTML = escapeHtml(data.message);
                    }
                    loadMessages();
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('message').innerHTML = 'Server error';
                    loadMessages();
                });
        });
    }

    function loadMessages(){
        fetch('/messages')
            .then(response => response.text())
            .then(html => {
                const chatbox = document.getElementById('chatbox');
                chatbox.innerHTML = html;
                chatbox.scrollTop = chatbox.scrollHeight;
            })
            .catch(error => console.error(error));
    }

    function escapeHtml(text){
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.getElementById('chatbox').scrollTop = document.getElementById('chatbox').scrollHeight;
    ask();
    </script>
</body>
</html>
